name: BIM AI Kiến Trúc 360 V161 Portable Windows x64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'app/**'
      - 'learning/**'
      - 'recognition/**'
      - 'evaluation/**'
      - 'training/**'
      - 'tools/**'
      - 'tests/**'
      - 'demo_data/**'
      - 'run_portable.py'
      - 'requirements.txt'
      - 'requirements-runtime.txt'
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'app/**'
      - 'learning/**'
      - 'recognition/**'
      - 'evaluation/**'
      - 'training/**'
      - 'tools/**'
      - 'tests/**'
      - 'demo_data/**'
      - 'run_portable.py'
      - 'requirements.txt'
      - 'requirements-runtime.txt'
jobs:
  windows-v106:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Require the V161 entry point only
        run: |
          if (!(Test-Path 'run_portable.py')) { throw 'V161 launcher missing' }
          if (!(Test-Path 'app/generate.py')) { throw 'V161 Studio UI missing' }
          if (!(Test-Path 'APP_VERSION.txt')) { throw 'V161 release marker missing' }
          if ((Get-Content APP_VERSION.txt -Raw) -notmatch 'V161') { throw 'Wrong release version marker' }
          if ((Get-Content app/generate.py -Raw) -notmatch 'BIM AI Kiến Trúc 360 V161') { throw 'UI still advertises an old version' }
          if (Test-Path 'tbt360_ai/app.py') { throw 'Legacy V26 UI still present' }
          if (Test-Path 'main.py') { throw 'Legacy V26 entry point still present' }
          $launcher = Get-Content 'run_portable.py' -Raw
          if ($launcher -notmatch "run_module\('app.generate'") { throw 'Launcher does not start V161 Studio' }
      - name: Install CPU build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'torch==2.5.1' 'torchvision==0.20.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-runtime.txt
          python -m pip install 'pyinstaller==6.16.0'
          python -m pip check
      - name: Run V161 regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and self-test actual V161 Studio
        run: python tools/build_release.py --profile cpu
      - name: Smoke test V161 Gradio launch and HTTP readiness
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/BIMAI360/BIMAI360.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'v161-launch-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v161-launch-stderr.log'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          $env:no_proxy = $env:NO_PROXY
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              $proc.Refresh()
              if ($proc.HasExited) { throw "V161 EXE exited during launch with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:7861/' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match 'gradio') { $ready = $true; break }
              } catch { }
            }
            if (!$ready) { throw 'V161 Gradio UI did not become ready on http://127.0.0.1:7861/' }
            Write-Host 'PASS: V161 EXE launched Gradio UI and served HTTP 200'
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Get-Content $stdout -Tail 120 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 120 }
          }
      - name: Upload V161 launch logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: V161_RUNTIME_LAUNCH_LOGS
          path: ${{ runner.temp }}/v161-launch-*.log
          if-no-files-found: ignore
      - name: Verify artifact and checksum
        run: |
          if (!(Test-Path 'BIMAI360_V161_PORTABLE_WINDOWS_X64_CPU.zip')) { throw 'Portable ZIP missing' }
          python -m tools.verify_portable dist/BIMAI360
          Get-FileHash BIMAI360_V161_PORTABLE_WINDOWS_X64_CPU.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v7
        with:
          name: BIMAI360_V161_PORTABLE_WINDOWS_X64_CPU
          path: BIMAI360_V161_PORTABLE_WINDOWS_X64_CPU.zip
          if-no-files-found: error
