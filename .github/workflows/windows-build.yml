name: TBT360 AI V78 Portable Windows x64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'app/**'
      - 'learning/**'
      - 'recognition/**'
      - 'evaluation/**'
      - 'training/**'
      - 'tools/**'
      - 'tests/**'
      - 'demo_data/**'
      - 'run_portable.py'
      - 'requirements.txt'
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'app/**'
      - 'learning/**'
      - 'recognition/**'
      - 'evaluation/**'
      - 'training/**'
      - 'tools/**'
      - 'tests/**'
      - 'demo_data/**'
      - 'run_portable.py'
      - 'requirements.txt'
jobs:
  windows-v78:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Require the V78 entry point only
        run: |
          if (!(Test-Path 'run_portable.py')) { throw 'V78 launcher missing' }
          if (!(Test-Path 'app/generate.py')) { throw 'V78 Studio UI missing' }
          if (Test-Path 'tbt360_ai/app.py') { throw 'Legacy V26 UI still present' }
          if (Test-Path 'main.py') { throw 'Legacy V26 entry point still present' }
          $launcher = Get-Content 'run_portable.py' -Raw
          if ($launcher -notmatch "run_module\('app.generate'") { throw 'Launcher does not start V78 Studio' }
      - name: Install CPU build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'torch==2.5.1' 'torchvision==0.20.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements.txt
          python -m pip install 'pyinstaller==6.16.0'
          python -m pip check
      - name: Run V78 regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and self-test actual V78 Studio
        run: python tools/build_release.py --profile cpu
      - name: Verify artifact and checksum
        run: |
          if (!(Test-Path 'TBT360_AI_PORTABLE_WINDOWS_X64_CPU.zip')) { throw 'Portable ZIP missing' }
          python -m tools.verify_portable dist/TBT360_AI
          Get-FileHash TBT360_AI_PORTABLE_WINDOWS_X64_CPU.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: TBT360_AI_V78_PORTABLE_WINDOWS_X64_CPU
          path: TBT360_AI_PORTABLE_WINDOWS_X64_CPU.zip
          if-no-files-found: error
