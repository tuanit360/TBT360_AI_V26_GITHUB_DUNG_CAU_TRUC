name: BIM AI Kiến Trúc 360 V271 Portable Windows x64
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'app/**'
      - 'learning/**'
      - 'recognition/**'
      - 'evaluation/**'
      - 'training/**'
      - 'tools/**'
      - 'tests/**'
      - 'demo_data/**'
      - 'run_portable.py'
      - 'CHAY_BIMAI360_CPU_KHONG_CUDA.bat'
      - 'MO_LOG_KHONG_CAN_UI.bat'
      - 'README_PORTABLE.md'
      - 'APP_VERSION.txt'
      - 'requirements.txt'
      - 'requirements-runtime.txt'
  pull_request:
    paths:
      - '.github/workflows/windows-build.yml'
      - 'app/**'
      - 'learning/**'
      - 'recognition/**'
      - 'evaluation/**'
      - 'training/**'
      - 'tools/**'
      - 'tests/**'
      - 'demo_data/**'
      - 'run_portable.py'
      - 'CHAY_BIMAI360_CPU_KHONG_CUDA.bat'
      - 'MO_LOG_KHONG_CAN_UI.bat'
      - 'README_PORTABLE.md'
      - 'APP_VERSION.txt'
      - 'requirements.txt'
      - 'requirements-runtime.txt'
jobs:
  windows-v106:
    runs-on: windows-2022
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Require the V271 entry point only
        run: |
          if (!(Test-Path 'run_portable.py')) { throw 'V271 launcher missing' }
          if (!(Test-Path 'app/generate.py')) { throw 'V271 Studio UI missing' }
          if (!(Test-Path 'APP_VERSION.txt')) { throw 'V271 release marker missing' }
          if ((Get-Content APP_VERSION.txt -Raw) -notmatch 'V271') { throw 'Wrong release version marker' }
          if ((Get-Content app/generate.py -Raw) -notmatch 'BIM AI Kiến Trúc 360 V271') { throw 'UI still advertises an old version' }
          if (Test-Path 'tbt360_ai/app.py') { throw 'Legacy V26 UI still present' }
          if (Test-Path 'main.py') { throw 'Legacy V26 entry point still present' }
          $launcher = Get-Content 'run_portable.py' -Raw
          if ($launcher -notmatch "run_module\('app.generate'") { throw 'Launcher does not start V271 Studio' }
      - name: Fast Python syntax gate before heavy dependencies
        run: |
          python -m compileall -q app learning recognition evaluation training tools tests run_portable.py
          python -c "import ast, pathlib; ast.parse(pathlib.Path('app/generate.py').read_text(encoding='utf-8'))"
      - name: Install CPU build dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install 'torch==2.5.1' 'torchvision==0.20.1' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -r requirements-runtime.txt
          python -m pip install 'pyinstaller==6.16.0'
          python -m pip check
      - name: Run V271 regression tests
        run: python -m unittest discover -s tests -v
      - name: Build and self-test actual V271 Studio
        run: python tools/build_release.py --profile cpu
      - name: Smoke test V271 Gradio launch and HTTP readiness
        shell: pwsh
        run: |
          $exe = (Resolve-Path 'dist/BIMAI360/BIMAI360.exe').Path
          $stdout = Join-Path $env:RUNNER_TEMP 'v271-launch-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v271-launch-stderr.log'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          $env:no_proxy = $env:NO_PROXY
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              $proc.Refresh()
              if ($proc.HasExited) { throw "V271 EXE exited during launch with code $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:7861/' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match 'gradio') { $ready = $true; break }
              } catch { }
            }
            if (!$ready) { throw 'V271 Gradio UI did not become ready on http://127.0.0.1:7861/' }
            Write-Host 'PASS: V271 EXE launched Gradio UI and served HTTP 200'
            python tools/smoke_bim_ui.py
            if ($LASTEXITCODE -ne 0) { throw 'V271 real BIM button smoke failed' }
            python -m tools.smoke_gradio_image_transport
            if ($LASTEXITCODE -ne 0) { throw 'V271 frozen Gradio PNG transport failed' }
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Get-Content $stdout -Tail 120 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 120 }
          }
      - name: Upload V271 launch logs on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: V271_RUNTIME_LAUNCH_LOGS
          path: ${{ runner.temp }}/v271-launch-*.log
          if-no-files-found: ignore
      - name: Verify artifact and checksum
        run: |
          if (!(Test-Path 'BIMAI360_V271_PORTABLE_WINDOWS_X64_CPU.zip')) { throw 'Portable ZIP missing' }
          python -m tools.verify_portable dist/BIMAI360
          python -c "import pathlib,tempfile,zipfile; from tools.verify_portable import verify,verify_release_structure; archive=pathlib.Path('BIMAI360_V271_PORTABLE_WINDOWS_X64_CPU.zip'); t=tempfile.TemporaryDirectory(); zipfile.ZipFile(archive).extractall(t.name); root=pathlib.Path(t.name)/'BIMAI360'; issues=verify(root)+verify_release_structure(root); print('EXTRACTED ZIP VERIFY:',issues or 'PASS'); assert not issues,issues; assert (root/'BIMAI360.exe').is_file(); t.cleanup()"
          if ($LASTEXITCODE -ne 0) { throw 'Extracted Portable verification failed' }
          $extractedExe = Join-Path $env:RUNNER_TEMP 'bimai360-extracted-smoke'
          New-Item -ItemType Directory -Path $extractedExe -Force | Out-Null
          Expand-Archive -Path BIMAI360_V271_PORTABLE_WINDOWS_X64_CPU.zip -DestinationPath $extractedExe -Force
          & (Join-Path $extractedExe 'BIMAI360/BIMAI360.exe') --self-test
          if ($LASTEXITCODE -ne 0) { throw 'EXE self-test failed after ZIP extraction' }
      - name: Smoke test extracted Portable EXE serves real UI
        run: |
          $exe = (Resolve-Path (Join-Path $env:RUNNER_TEMP 'bimai360-extracted-smoke/BIMAI360/BIMAI360.exe')).Path
          $stdout = Join-Path $env:RUNNER_TEMP 'v271-extracted-stdout.log'
          $stderr = Join-Path $env:RUNNER_TEMP 'v271-extracted-stderr.log'
          $env:NO_PROXY = '127.0.0.1,localhost,::1'
          $env:no_proxy = $env:NO_PROXY
          $proc = Start-Process -FilePath $exe -WorkingDirectory (Split-Path $exe) -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 45; $i++) {
              Start-Sleep -Seconds 2
              $proc.Refresh()
              if ($proc.HasExited) { throw "Extracted EXE exited early: $($proc.ExitCode)" }
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:7861/' -UseBasicParsing -TimeoutSec 3
                if ($response.StatusCode -eq 200 -and $response.Content -match 'gradio') {
                  $ready = $true
                  break
                }
              } catch { }
            }
            if (!$ready) { throw 'Extracted EXE did not serve Gradio HTTP 200' }
            Write-Host 'PASS: extracted Portable EXE serves real UI'
          } finally {
            if (!$proc.HasExited) { Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue }
            if (Test-Path $stdout) { Get-Content $stdout -Tail 80 }
            if (Test-Path $stderr) { Get-Content $stderr -Tail 80 }
          }
          Get-FileHash BIMAI360_V271_PORTABLE_WINDOWS_X64_CPU.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v7
        with:
          name: BIMAI360_V271_PORTABLE_WINDOWS_X64_CPU
          path: BIMAI360_V271_PORTABLE_WINDOWS_X64_CPU.zip
          if-no-files-found: error
