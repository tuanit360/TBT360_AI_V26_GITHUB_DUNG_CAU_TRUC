name: Windows native EXE build
on:
  workflow_dispatch:
  push:
    paths:
      - 'tbt360_ai/**'
      - 'main.py'
      - 'requirements.txt'
      - '.github/workflows/windows-build.yml'
jobs:
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build EXE folder
        run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name TBT360_AI --collect-all torch --collect-all torchvision main.py
      - name: Smoke test executable launch
        shell: pwsh
        run: |
          $proc = Start-Process -FilePath 'dist/TBT360_AI/TBT360_AI.exe' -PassThru
          Start-Sleep -Seconds 12
          if ($proc.HasExited) { throw "EXE exited unexpectedly with $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id
      - name: Zip native app
        shell: pwsh
        run: Compress-Archive -Path dist/TBT360_AI -DestinationPath TBT360_AI_WINDOWS_X64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: TBT360_AI_WINDOWS_X64
          path: TBT360_AI_WINDOWS_X64.zip
